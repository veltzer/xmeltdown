# Repo-specific overlay. Deep-merged over the canonical rsconstruct.toml.

# README.md renders from tera.templates/README.md.tera, loading config/*.lua
# with load_lua (the pyanyzip pattern). The pydmt mako templates are gone.
[processor.tera]
src_dirs = ["tera.templates"]

# The Makefile compiled src/*.c to objects and linked five X11 binaries, with
# draw.o shared across stickman/stickread/dance, all against -lX11 -lm. That
# shared-object grouping is beyond the single-file C processor, so
# scripts/build_xmeltdown.py runs the exact compile+link. (The Makefile's
# uncrustify target was a manual .PHONY format step, not part of the build.)
# It also builds wlmelt, the Wayland port of xmeltdown, generating the
# protocol glue from the XMLs in protocol/ with wayland-scanner.
[processor.explicit.xmeltdown]
command = "scripts/build_xmeltdown.py"
input_globs = ["src/*.c", "protocol/*.xml"]
output_files = [
    "out/bin/grid",
    "out/bin/stickman",
    "out/bin/stickread",
    "out/bin/dance",
    "out/bin/xmeltdown",
    "out/bin/wlmelt",
]

# X11 headers/libs the demos link against, plus the Wayland client
# library, wayland-scanner, the standard protocol XMLs and libpng for
# wlmelt, so CI can build them.
[dependencies]
system = [
    "libx11-dev",
    "libwayland-dev",
    "wayland-protocols",
    "libpng-dev",
]
