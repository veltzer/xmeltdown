# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]
src_dirs = ["tera.templates"]

[processor.ruff]
src_dirs = ["src", "scripts", "config"]

[processor.pylint]
src_dirs = ["src", "scripts", "config"]

[processor.mypy]
src_dirs = ["src", "scripts", "config"]

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# The Makefile compiled src/*.c to objects and linked five X11 binaries, with
# draw.o shared across stickman/stickread/dance, all against -lX11 -lm. That
# shared-object grouping is beyond the single-file C processor, so
# scripts/build_xmeltdown.py runs the exact compile+link. (The Makefile's
# uncrustify target was a manual .PHONY format step, not part of the build.)
# It also builds wlmelt, the Wayland port of xmeltdown, generating the
# protocol glue from the XMLs in protocol/ with wayland-scanner.
[processor.explicit.xmeltdown]
command = "scripts/build_xmeltdown.py"
input_globs = ["src/*.c", "protocol/*.xml"]
output_files = [
    "out/bin/grid",
    "out/bin/stickman",
    "out/bin/stickread",
    "out/bin/dance",
    "out/bin/xmeltdown",
    "out/bin/wlmelt",
]

# X11 headers/libs the demos link against, plus the Wayland client
# library, wayland-scanner, the standard protocol XMLs and libpng for
# wlmelt, so CI can build them.
[dependencies]
system = [
    "libx11-dev",
    "libwayland-dev",
    "wayland-protocols",
    "libpng-dev",
]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
